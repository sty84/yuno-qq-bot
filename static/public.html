<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuno 公开状态</title>
  <script src="/static/vendor/echarts.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js';"></script>
  <style>
    :root {
      --bg: #fdf2f8;
      --panel: rgba(255,255,255,0.72);
      --panel-border: rgba(255,255,255,0.9);
      --text: #1e293b;
      --muted: #64748b;
      --accent: #ec4899;
      --accent2: #a855f7;
      --accent3: #06b6d4;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); margin: 0; padding: 24px;
      min-height: 100vh;
    }
    .wrap { max-width: 1080px; margin: 0 auto; position: relative; z-index: 1; }
    h1 { font-size: 28px; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
         -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .cards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 18px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
      padding: 16px 18px; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(236,72,153,.08);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(236,72,153,.35); box-shadow: 0 12px 30px rgba(236,72,153,.15); }
    .card .k { font-size: 12px; color: var(--muted); }
    .card .v { font-size: 26px; font-weight: 800; margin-top: 6px; }
    .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .muted { color: var(--muted); font-size: 12px; margin-top: 20px; }
    .panel {
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 20px;
      padding: 20px; margin-top: 22px; backdrop-filter: blur(14px); box-shadow: 0 8px 30px rgba(168,85,247,.08);
    }
    .panel h2 { font-size: 18px; margin: 0 0 10px; color: #7c3aed; }
    .chart { width: 100%; height: 320px; margin-top: 12px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 13px; }
    th, td { border: 1px solid rgba(100,116,139,.2); padding: 8px 12px; text-align: left; }
    th { background: rgba(255,255,255,0.6); color: #6d28d9; }
    tr:hover td { background: rgba(255,255,255,0.4); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 760px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .bg-bands { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-bands i { position: absolute; display: block; border-radius: 50%; filter: blur(80px); opacity: .5; will-change: transform; }
    .bg-bands i:nth-child(1) { width: 55vw; height: 55vw; top: -12%; left: -8%; background: radial-gradient(circle, #f472b6, transparent 70%); animation: drift1 24s ease-in-out infinite alternate; }
    .bg-bands i:nth-child(2) { width: 45vw; height: 45vw; top: 10%; right: -10%; background: radial-gradient(circle, #a78bfa, transparent 70%); animation: drift2 28s ease-in-out infinite alternate; }
    .bg-bands i:nth-child(3) { width: 50vw; height: 50vw; bottom: -15%; left: 15%; background: radial-gradient(circle, #22d3ee, transparent 70%); animation: drift3 26s ease-in-out infinite alternate; }
    .bg-bands i:nth-child(4) { width: 40vw; height: 40vw; top: 45%; left: -12%; background: radial-gradient(circle, #34d399, transparent 70%); animation: drift4 30s ease-in-out infinite alternate; }
    .bg-bands i:nth-child(5) { width: 48vw; height: 48vw; bottom: 5%; right: 5%; background: radial-gradient(circle, #fbbf24, transparent 70%); animation: drift5 32s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(10vw,6vh) scale(1.15); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-8vw,10vh) scale(1.1); } }
    @keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(12vw,-6vh) scale(1.2); } }
    @keyframes drift4 { from { transform: translate(0,0) scale(1); } to { transform: translate(-6vw,-8vh) scale(1.1); } }
    @keyframes drift5 { from { transform: translate(0,0) scale(1); } to { transform: translate(-10vw,8vh) scale(1.15); } }
  </style>
</head>
<body>
  <div class="bg-bands" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="wrap">
    <h1>Yuno 公开状态</h1>
    <div class="subtitle">成长型 Agent 记忆系统 · 实时状态与评测趋势</div>
    <div class="cards" id="cards">加载中…</div>
    <div class="muted" id="updated"></div>

    <div class="grid-2">
      <div class="panel">
        <h2>历史评测趋势</h2>
        <div id="trendChart" class="chart"></div>
      </div>
      <div class="panel">
        <h2>最近评测明细</h2>
        <div id="trendTable">加载中…</div>
      </div>
    </div>
  </div>

  <script>
    function fmt(v) {
      return v === null || v === undefined ? '-' : Number(v).toFixed(3);
    }
    function money(v) { return '¥' + Number(v || 0).toFixed(4); }
    function num(v) { return Number(v || 0).toLocaleString(); }

    fetch('/api/public/stats')
      .then(r => r.json())
      .then(data => {
        const cost = data.today_cost || {};
        const cards = [
          ['记忆条数', num(data.memory_count), '长期记忆'],
          ['事件数', num(data.event_count), '事件图谱'],
          ['对话数', num(data.conv_count), '对话记录'],
          ['轨迹数', num(data.trace_count), '处理轨迹'],
          ['今日调用', num(cost.calls), 'LLM 请求'],
          ['Prompt', num(cost.prompt), 'tokens'],
          ['Completion', num(cost.completion), 'tokens'],
          ['今日成本', money(cost.cost), '估算费用'],
        ];
        document.getElementById('cards').innerHTML = cards.map(([k, v, sub]) =>
          `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="sub">${sub}</div></div>`
        ).join('');
        document.getElementById('updated').textContent = '更新于 ' + (data.updated_at || '');
      })
      .catch(e => {
        document.getElementById('cards').textContent = '加载失败：' + e;
      });

    fetch('/api/public/trend')
      .then(r => r.json())
      .then(data => {
        const mem = data.memory_eval || [];
        if (!mem.length) {
          document.getElementById('trendChart').textContent = '暂无历史评测数据';
          document.getElementById('trendTable').textContent = '暂无历史评测数据';
          return;
        }
        const times = mem.map(x => x.ts);
        const series = [
          { name: 'Recall', key: 'recall' },
          { name: 'MRR', key: 'mrr' },
          { name: 'NDCG', key: 'ndcg' },
        ].map(s => ({
          name: s.name,
          type: 'line',
          smooth: true,
          symbol: 'circle',
          symbolSize: 6,
          lineStyle: { width: 2 },
          data: mem.map(x => x.metrics?.[s.key] ?? null),
        }));
        const chart = echarts.init(document.getElementById('trendChart'));
        chart.setOption({
          backgroundColor: 'transparent',
          textStyle: { color: '#1e293b' },
          tooltip: { trigger: 'axis' },
          legend: { textStyle: { color: '#1e293b' }, top: 0 },
          grid: { left: 50, right: 20, top: 40, bottom: 40 },
          xAxis: { type: 'category', data: times, axisLabel: { color: '#64748b' } },
          yAxis: { type: 'value', min: 0, max: 1, axisLabel: { color: '#64748b' } },
          color: ['#ec4899', '#a855f7', '#06b6d4'],
          series,
        });

        const table = document.createElement('table');
        table.innerHTML = '<tr><th>时间</th><th>Recall</th><th>MRR</th><th>NDCG</th></tr>' +
          mem.map(x => `<tr><td>${x.ts}</td><td>${fmt(x.metrics?.recall)}</td><td>${fmt(x.metrics?.mrr)}</td><td>${fmt(x.metrics?.ndcg)}</td></tr>`).join('');
        document.getElementById('trendTable').innerHTML = '';
        document.getElementById('trendTable').appendChild(table);
      })
      .catch(e => {
        document.getElementById('trendChart').textContent = '趋势加载失败：' + e;
      });
  </script>
</body>
</html>
