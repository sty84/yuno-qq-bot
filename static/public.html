<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuno 公开状态</title>
  <script src="/static/vendor/echarts.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js';"></script>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { background: #1e293b; border-radius: 10px; padding: 14px; }
    .k { font-size: 12px; color: #94a3b8; }
    .v { font-size: 24px; font-weight: 600; margin-top: 4px; }
    .muted { color: #64748b; font-size: 12px; margin-top: 20px; }
    .panel { background: #111c33; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-top: 20px; }
    .chart { width: 100%; height: 320px; margin-top: 12px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 13px; }
    th, td { border: 1px solid #334155; padding: 6px 10px; text-align: left; }
    th { background: #1e293b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Yuno 公开状态</h1>
    <div class="cards" id="cards">加载中…</div>
    <div class="muted" id="updated"></div>

    <div class="panel">
      <h2>历史评测趋势</h2>
      <div id="trendChart" class="chart"></div>
      <div id="trendTable"></div>
    </div>
  </div>

  <script>
    function fmt(v) {
      return v === null || v === undefined ? '-' : Number(v).toFixed(3);
    }

    fetch('/api/public/stats')
      .then(r => r.json())
      .then(data => {
        const cards = [
          ['记忆条数', data.memory_count],
          ['事件数', data.event_count],
          ['对话数', data.conv_count],
          ['轨迹数', data.trace_count],
          ['今日成本', '¥' + (data.today_cost?.cost ?? 0)],
        ];
        document.getElementById('cards').innerHTML = cards.map(([k, v]) =>
          `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`
        ).join('');
        document.getElementById('updated').textContent = '更新于 ' + (data.updated_at || '');
      })
      .catch(e => {
        document.getElementById('cards').textContent = '加载失败：' + e;
      });

    fetch('/api/public/trend')
      .then(r => r.json())
      .then(data => {
        const mem = data.memory_eval || [];
        if (!mem.length) {
          document.getElementById('trendChart').textContent = '暂无历史评测数据';
          return;
        }
        const times = mem.map(x => x.ts);
        const series = [
          { name: 'Recall', key: 'recall' },
          { name: 'MRR', key: 'mrr' },
          { name: 'NDCG', key: 'ndcg' },
        ].map(s => ({
          name: s.name,
          type: 'line',
          smooth: true,
          data: mem.map(x => x.metrics?.[s.key] ?? null),
        }));
        const chart = echarts.init(document.getElementById('trendChart'));
        chart.setOption({
          backgroundColor: 'transparent',
          textStyle: { color: '#e2e8f0' },
          tooltip: { trigger: 'axis' },
          legend: { textStyle: { color: '#e2e8f0' }, top: 0 },
          grid: { left: 50, right: 20, top: 40, bottom: 40 },
          xAxis: { type: 'category', data: times, axisLabel: { color: '#94a3b8' } },
          yAxis: { type: 'value', min: 0, max: 1, axisLabel: { color: '#94a3b8' } },
          series,
        });

        const table = document.createElement('table');
        table.innerHTML = '<tr><th>时间</th><th>Recall</th><th>MRR</th><th>NDCG</th></tr>' +
          mem.map(x => `<tr><td>${x.ts}</td><td>${fmt(x.metrics?.recall)}</td><td>${fmt(x.metrics?.mrr)}</td><td>${fmt(x.metrics?.ndcg)}</td></tr>`).join('');
        document.getElementById('trendTable').innerHTML = '';
        document.getElementById('trendTable').appendChild(table);
      })
      .catch(e => {
        document.getElementById('trendChart').textContent = '趋势加载失败：' + e;
      });
  </script>
</body>
</html>
