[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yuno-memory"
version = "2.4.0"
description = "成长型 Agent 记忆系统 SDK（统一记忆/纠错/轨迹/评测/导出）"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=2.7.0",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2",
]

[tool.setuptools]
packages = ["yuno_memory", "memory", "agent", "plugins"]

[tool.pytest.ini_options]
# 只收集 tests/ 下的 test_*.py，避免把根目录的 e2e_test.py / load_test.py 当 pytest 用例收集
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
# 先启用关键错误类；历史风格问题分批放开
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E402",  # 模块级 import 顺序（历史代码较多，后续分批修）
  "E741",  # 单字母变量名（历史代码）
  "F841",  # 未使用变量（测试中常见）
  "F811",  # 重复导入/重定义（测试中常见）
  "E702",  # 单行多条语句（历史代码）
]
