[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yuno-memory"
version = "2.4.0"
description = "成长型 Agent 记忆系统 SDK（统一记忆/纠错/轨迹/评测/导出）"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=2.7.0",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2",
]

[tool.setuptools]
packages = ["yuno_memory", "memory", "agent", "plugins"]

[tool.pytest.ini_options]
# 只收集 tests/ 下的 test_*.py，避免把根目录的 e2e_test.py / load_test.py 当 pytest 用例收集
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
# 先启用关键错误类；历史风格问题分批放开
select = ["E4", "E7", "E9", "F"]
ignore = []

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
files = [
  "memory/interfaces.py",
  "memory/telemetry.py",
  "agent/core.py",
  "web/app.py",
  "web/auth.py",
  "web/routes_admin.py",
  "web/routes_cognitive.py",
  "web/routes_eval.py",
  "tools",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = [
  "memory/interfaces.py",
  "agent/core.py",
  "web",
  "tools/core.py",
]
