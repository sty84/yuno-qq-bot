name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # P1-1：补齐 web 层依赖（fastapi/httpx 供 TestClient 冒烟）+ jieba 分词一致性；
        # 不装 torch/sentence-transformers（embedder 延迟加载，provider=none 时不需要）
        run: |
          python -m pip install --upgrade pip
          pip install pytest openai python-dotenv fastapi httpx uvicorn jieba
      - name: Syntax check (all py)
        # P1-1：全量语法检查（git ls-files 含 webapp.py / yuno_memory / tests，修复前只查 7 个文件）
        run: python -m py_compile $(git ls-files '*.py')
      - name: Config validate
        # 配置新增段/字段后这里会先拦住未知配置告警，避免带病上线
        run: python tools.py config-validate
      - name: Regression + smoke tests
        run: python -m pytest tests/ -q
      - name: Persona freshcheck (migration gate)
        # 新 pack 可迁移性验收：干净环境跑核心链路（身份/检索/约定/防编造/情绪），
        # 任一 pack 失败退出码 1 → 换人设/改 pack 的破坏第一时间被拦
        run: |
          python tools.py persona-freshcheck --pack yuno
          python tools.py persona-freshcheck --pack office

  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YUNO_DB_BACKEND: postgresql
      YUNO_PG_HOST: 127.0.0.1
      YUNO_PG_PORT: 5432
      YUNO_PG_DB: ci_test
      YUNO_PG_USER: postgres
      YUNO_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest openai python-dotenv fastapi httpx uvicorn jieba psycopg2-binary psycopg_pool
      - name: Init PG schema
        run: python scripts/pg_init_schema.py
      - name: PG full pytest
        run: python -m pytest tests/ -q
